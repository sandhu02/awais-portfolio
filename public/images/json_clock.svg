<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#022c22"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="widgetGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="400" height="820" rx="44" fill="#09090b" stroke="url(#phoneBorder)" stroke-width="6"/>
  <!-- Screen Wallpaper -->
  <rect x="20" y="20" width="380" height="800" rx="36" fill="url(#wallBg)"/>

  <!-- Camera Punchhole -->
  <circle cx="210" cy="38" r="6" fill="#000000"/>
  <circle cx="210" cy="38" r="3" fill="#1e293b"/>

  <!-- Android Status Bar -->
  <text x="45" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">10:09</text>
  <g transform="translate(330, 33)">
    <path d="M0 10 L4 6 L8 10 Z" fill="#cbd5e1"/>
    <path d="M12 10 L16 3 L20 10 Z" fill="#cbd5e1"/>
    <rect x="25" y="2" width="20" height="9" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="27" y="4" width="14" height="5" rx="1" fill="#34d399"/>
    <rect x="45" y="5" width="2" height="3" fill="#cbd5e1"/>
  </g>

  <!-- Google Search Bar (At Top) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="340" height="48" rx="24" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="30" cy="24" r="10" fill="#3b82f6"/>
    <text x="26" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">G</text>
    <text x="56" y="29" fill="#94a3b8" font-family="sans-serif" font-size="13">Search apps, web &amp; notes...</text>
    <circle cx="310" cy="24" r="12" fill="#1e293b"/>
    <path d="M307 24 V20 M307 20 A3 3 0 0 1 313 20 V24 A3 3 0 0 1 307 24 Z M305 23 A5 5 0 0 0 315 23 M310 27 V30" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- JsonClock Glance Widget (Hero Feature) -->
  <g transform="translate(35, 150)" filter="url(#shadow)">
    <!-- Widget Body -->
    <rect x="0" y="0" width="350" height="340" rx="28" fill="url(#widgetGlass)" stroke="#169458" stroke-width="2"/>

    <!-- Widget Header Pill -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="170" height="24" rx="12" fill="#169458" fill-opacity="0.2"/>
      <circle cx="12" cy="12" r="4" fill="#34d399"/>
      <text x="24" y="16" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Jetpack Glance Widget</text>
    </g>
    <text x="310" y="36" fill="#64748b" font-family="monospace" font-size="14" font-weight="bold">4x3</text>

    <!-- JSON Syntax Display -->
    <g transform="translate(26, 75)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14">
      <!-- { -->
      <text x="0" y="0" fill="#f8fafc" font-weight="bold">{</text>
      
      <!-- "clock": { -->
      <text x="18" y="28" fill="#e2e8f0">"clock": {</text>
      <text x="36" y="54" fill="#38bdf8">"time"</text>
      <text x="88" y="54" fill="#94a3b8">:</text>
      <text x="106" y="54" fill="#34d399" font-weight="bold">"10:09:42"</text>
      <text x="195" y="54" fill="#94a3b8">,</text>

      <text x="36" y="80" fill="#38bdf8">"format"</text>
      <text x="105" y="80" fill="#94a3b8">:</text>
      <text x="122" y="80" fill="#fb923c">"AM (24h)"</text>
      <text x="210" y="80" fill="#94a3b8">,</text>

      <text x="36" y="106" fill="#38bdf8">"date"</text>
      <text x="88" y="106" fill="#94a3b8">:</text>
      <text x="106" y="106" fill="#fde047">"Wednesday, Oct 28"</text>
      <text x="18" y="132" fill="#e2e8f0">},</text>

      <!-- "telemetry": { -->
      <text x="18" y="160" fill="#e2e8f0">"telemetry": {</text>
      <text x="36" y="186" fill="#38bdf8">"battery"</text>
      <text x="114" y="186" fill="#94a3b8">:</text>
      <text x="130" y="186" fill="#4ade80" font-weight="bold">88</text>
      <text x="150" y="186" fill="#94a3b8">,</text>
      <text x="165" y="186" fill="#64748b">// % remaining</text>

      <text x="36" y="212" fill="#38bdf8">"charging"</text>
      <text x="122" y="212" fill="#94a3b8">:</text>
      <text x="140" y="212" fill="#f87171">false</text>
      <text x="185" y="212" fill="#94a3b8">,</text>

      <text x="36" y="238" fill="#38bdf8">"theme"</text>
      <text x="96" y="238" fill="#94a3b8">:</text>
      <text x="114" y="238" fill="#a78bfa">"MaterialYou.Dark"</text>
      
      <text x="18" y="264" fill="#e2e8f0">}</text>

      <!-- } -->
      <text x="0" y="290" fill="#f8fafc" font-weight="bold">}</text>
    </g>
  </g>

  <!-- Secondary Glance Mini Widget (Battery Status) -->
  <g transform="translate(35, 515)">
    <rect x="0" y="0" width="350" height="90" rx="22" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="25" cy="25" r="22" fill="#169458" fill-opacity="0.2"/>
      <path d="M22 14 H28 V17 H22 Z M18 17 H32 V36 H18 Z M21 21 L28 29 M28 21 L21 29" fill="#34d399"/>
      <text x="60" y="20" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">JsonClock Service Worker</text>
      <text x="60" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Next sync in 58s • WakeLock Free</text>
    </g>
    <rect x="270" y="32" width="60" height="26" rx="13" fill="#169458"/>
    <text x="282" y="49" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">ACTIVE</text>
  </g>

  <!-- App Dock Icons (Bottom) -->
  <g transform="translate(45, 680)">
    <!-- Phone -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#10b981"/>
    <path d="M22 20 C22 28 28 34 36 34 L38 31 L33 26 L30 28 C26 25 25 24 23 20 L25 17 L20 12 Z" fill="#ffffff"/>

    <!-- Messages -->
    <rect x="85" y="0" width="56" height="56" rx="16" fill="#3b82f6"/>
    <path d="M18 18 H38 V32 H24 L18 36 Z" fill="#ffffff"/>

    <!-- Chrome / Browser -->
    <rect x="170" y="0" width="56" height="56" rx="16" fill="#ef4444"/>
    <circle cx="198" cy="28" r="10" fill="#ffffff"/>
    <circle cx="198" cy="28" r="5" fill="#3b82f6"/>

    <!-- JsonLauncher App -->
    <rect x="255" y="0" width="56" height="56" rx="16" fill="#09090b" stroke="#169458" stroke-width="2"/>
    <text x="274" y="36" fill="#169458" font-family="monospace" font-size="24" font-weight="bold">{</text>
    <text x="286" y="36" fill="#ffffff" font-family="monospace" font-size="24" font-weight="bold">}</text>
  </g>

  <!-- Android Navigation Bar (Gestural Line) -->
  <rect x="160" y="805" width="100" height="4" rx="2" fill="#64748b"/>
</svg>
